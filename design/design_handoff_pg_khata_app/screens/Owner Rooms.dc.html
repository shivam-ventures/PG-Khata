<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-da389023-42f5-471e-ad5c-349391820232/styles.css">
  <link rel="stylesheet" href="tokens-extra.css">
  <script src="_ds/modernist-da389023-42f5-471e-ad5c-349391820232/_ds_bundle.js"></script>
  <style>
    body{margin:0}
    a{color:var(--color-accent)}
    a:hover{color:var(--color-accent-600)}
    .rooms-toolbar{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
    .room-card{background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:14px;margin-bottom:12px}
    .room-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--color-divider)}
    .bed-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:13px}
    .bed-dot{width:7px;height:7px;border-radius:50%;flex:none}
    .empty-note{padding:32px;text-align:center;color:var(--color-text-muted);font-size:14px}
  </style>
</helmet>
<div data-theme="{{ theme }}" style="min-height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);display:flex;flex-direction:column;max-width:480px;margin:0 auto;box-shadow:var(--shadow-lg)">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--color-surface);border-bottom:1px solid var(--color-divider);gap:10px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:10px">
      <a href="Properties.dc.html" style="color:var(--color-text);text-decoration:none;font-size:18px">←</a>
      <div>
        <h2 style="margin:0;font-size:19px">{{ propertyName }}</h2>
        <div class="text-muted" style="font-size:12px">Rooms &amp; beds</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <dc-import name="RoleSwitcher" current-role="owner" hint-size="100px,36px"></dc-import>
      <button class="theme-toggle" style="padding:6px" onClick="{{ toggleTheme }}">{{ themeIcon }}</button>
    </div>
  </div>

  <div style="padding:12px 16px 0">
    <select class="input" style="margin-bottom:8px" value="{{ currentId }}" onChange="{{ selectPropertyEvt }}">
      <sc-for list="{{ properties }}" as="p" hint-placeholder-count="3">
        <option value="{{ p.id }}">{{ p.name }}</option>
      </sc-for>
    </select>
    <button class="btn btn-primary btn-block" onClick="{{ openAdd }}">Add Room</button>
  </div>

  <div style="flex:1;overflow:auto;padding:16px">
    <div class="rooms-toolbar">
      <input class="input" type="text" placeholder="Search room or tenant" value="{{ search }}" onChange="{{ setSearch }}"></input>
      <select class="input" value="{{ filter }}" onChange="{{ setFilter }}">
        <option value="all">All rooms</option>
        <option value="vacant">Has vacant bed</option>
        <option value="occupied">Fully occupied</option>
      </select>
      <div class="text-muted" style="font-size:12px">{{ resultSummary }}</div>
    </div>

    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
      <div class="surface-card empty-note">No rooms match your search/filter.</div>
    </sc-if>

    <sc-for list="{{ floors }}" as="fl" hint-placeholder-count="2">
      <div>
        <h4 style="margin:0 0 10px">{{ fl.name }}</h4>
        <sc-for list="{{ fl.rooms }}" as="rm" hint-placeholder-count="3">
          <div class="room-card">
            <div class="room-head">
              <div style="font-weight:700">Room {{ rm.number }}</div>
              <div class="text-muted" style="font-size:12px">{{ rm.sharing }}</div>
            </div>
            <sc-for list="{{ rm.beds }}" as="bd" hint-placeholder-count="2">
              <div class="bed-row">
                <div style="display:flex;align-items:center;gap:8px">
                  <div class="bed-dot" style="background:{{ bd.dotColor }}"></div>
                  <span>Bed {{ bd.label }}</span>
                </div>
                <sc-if value="{{ bd.occupied }}" hint-placeholder-val="{{ true }}">
                  <span style="font-size:12px">{{ bd.tenant }}</span>
                </sc-if>
                <sc-if value="{{ bd.vacant }}" hint-placeholder-val="{{ false }}">
                  <a href="Tenants.dc.html" style="font-size:12px;font-weight:600">+ Add tenant</a>
                </sc-if>
              </div>
            </sc-for>
            <div class="text-muted" style="font-size:12px;margin-top:8px;padding-top:8px;border-top:1px solid var(--color-divider)">{{ rm.rentLabel }} / bed</div>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <div class="bottom-nav-v2" style="display:flex;position:sticky;bottom:0">
    <sc-for list="{{ ownerMobileTabs }}" as="tb" hint-placeholder-count="4">
      <a class="{{ tb.cls }}" href="{{ tb.href }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ tb.icon }}"></path></svg><span>{{ tb.label }}</span></a>
    </sc-for>
  </div>

  <sc-if value="{{ dialogOpen }}" hint-placeholder-val="{{ false }}">
    <div class="dialog-backdrop" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50">
      <div class="dialog" style="width:420px;max-width:92vw">
        <div class="dialog-title">Add room</div>
        <div class="dialog-body" style="display:flex;flex-direction:column;gap:12px;opacity:1">
          <div class="field"><label>Room number</label><input class="input" type="text" value="{{ form.number }}" onChange="{{ setNumber }}"></input></div>
          <div class="field">
            <label>Floor</label>
            <select class="input" value="{{ form.floor }}" onChange="{{ setFloor }}">
              <sc-for list="{{ floorNames }}" as="fn" hint-placeholder-count="2">
                <option value="{{ fn }}">{{ fn }}</option>
              </sc-for>
            </select>
          </div>
          <div class="field">
            <label>Sharing type</label>
            <select class="input" value="{{ form.sharing }}" onChange="{{ setSharing }}">
              <option value="Single">Single</option>
              <option value="Double sharing">Double sharing</option>
              <option value="Triple sharing">Triple sharing</option>
              <option value="Four sharing">Four sharing</option>
            </select>
          </div>
          <div class="field"><label>Rent per bed</label><input class="input" type="number" value="{{ form.rent }}" onChange="{{ setRent }}"></input></div>
        </div>
        <div class="dialog-actions">
          <button class="btn btn-secondary" onClick="{{ close }}">Cancel</button>
          <button class="btn btn-primary" onClick="{{ save }}">Save</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const BEDS_PER_SHARING = { 'Single': 1, 'Double sharing': 2, 'Triple sharing': 3, 'Four sharing': 4 };
const NAV_ICON = {
  Overview: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-4v-7H8v7H4a1 1 0 0 1-1-1V10.5Z',
  Properties: 'M4 21V4h9v17M13 21V9h7v12M4 21h16M7 8h2M7 12h2M7 16h2',
  Tenants: 'M8 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM2 20c0-3.3 2.7-6 6-6s6 2.7 6 6M17 8a3 3 0 1 1 0 6M22 20c0-2.8-1.9-5.1-4.5-5.8',
  More: 'M5 12h.01M12 12h.01M19 12h.01',
};

class Component extends DCLogic {
  state = {
    theme: 'light', currentId: 'hsr', search: '', filter: 'all',
    dialogOpen: false, form: { number: '', floor: 'Ground Floor', sharing: 'Triple sharing', rent: '' },
    data: {
      hsr: { name: 'HSR PG', floors: [
        { name: 'Ground Floor', rooms: [
          { number: '101', sharing: 'Triple sharing', rent: 6500, beds: [{ label: 'A', tenant: 'Ravi Kumar' }, { label: 'B', tenant: 'Amit Shah' }, { label: 'C', tenant: null }] },
          { number: '102', sharing: 'Double sharing', rent: 7500, beds: [{ label: 'A', tenant: 'Suresh Naik' }, { label: 'B', tenant: 'Deepak Rao' }] },
        ] },
        { name: 'First Floor', rooms: [
          { number: '201', sharing: 'Triple sharing', rent: 6500, beds: [{ label: 'A', tenant: 'Manoj Patil' }, { label: 'B', tenant: null }, { label: 'C', tenant: null }] },
        ] },
      ] },
      kor: { name: 'Koramangala PG', floors: [
        { name: 'Ground Floor', rooms: [
          { number: 'G1', sharing: 'Double sharing', rent: 8000, beds: [{ label: 'A', tenant: 'Vikas Gowda' }, { label: 'B', tenant: 'Rahul Jain' }] },
        ] },
      ] },
      ind: { name: 'Indiranagar PG', floors: [
        { name: 'Ground Floor', rooms: [
          { number: 'G1', sharing: 'Single', rent: 12000, beds: [{ label: 'A', tenant: 'Priya Menon' }] },
        ] },
      ] },
    },
  };
  toggleTheme = () => this.setState(s => ({ theme: s.theme === 'light' ? 'dark' : 'light' }));
  componentDidMount() {
    const p = new URLSearchParams(window.location.search).get('property');
    if (p && this.state.data[p]) this.setState({ currentId: p });
  }
  selectProperty = (id) => this.setState({ currentId: id });
  selectPropertyEvt = (e) => this.selectProperty(e.target.value);
  setSearch = (e) => this.setState({ search: e.target.value });
  setFilter = (e) => this.setState({ filter: e.target.value });
  openAdd = () => this.setState({ dialogOpen: true, form: { number: '', floor: 'Ground Floor', sharing: 'Triple sharing', rent: '' } });
  close = () => this.setState({ dialogOpen: false });
  setNumber = (e) => this.setState(s => ({ form: { ...s.form, number: e.target.value } }));
  setFloor = (e) => this.setState(s => ({ form: { ...s.form, floor: e.target.value } }));
  setSharing = (e) => this.setState(s => ({ form: { ...s.form, sharing: e.target.value } }));
  setRent = (e) => this.setState(s => ({ form: { ...s.form, rent: e.target.value } }));
  save = () => {
    const f = this.state.form;
    const bedCount = BEDS_PER_SHARING[f.sharing] || 1;
    const newRoom = { number: f.number || 'New', sharing: f.sharing, rent: parseInt(f.rent, 10) || 0, beds: Array.from({ length: bedCount }, (_, i) => ({ label: String.fromCharCode(65 + i), tenant: null })) };
    this.setState(s => {
      const prop = s.data[s.currentId];
      const floors = prop.floors.some(fl => fl.name === f.floor)
        ? prop.floors.map(fl => fl.name === f.floor ? { ...fl, rooms: [...fl.rooms, newRoom] } : fl)
        : [...prop.floors, { name: f.floor, rooms: [newRoom] }];
      return { dialogOpen: false, data: { ...s.data, [s.currentId]: { ...prop, floors } } };
    });
  };
  renderVals() {
    const s = this.state;
    const prop = s.data[s.currentId];
    const q = s.search.trim().toLowerCase();
    let totalRooms = 0, matchedRooms = 0;
    const floors = prop.floors.map(fl => {
      const rooms = fl.rooms.filter(rm => {
        totalRooms++;
        const hasVacant = rm.beds.some(bd => !bd.tenant);
        const matchesFilter = s.filter === 'all' || (s.filter === 'vacant' && hasVacant) || (s.filter === 'occupied' && !hasVacant);
        const matchesSearch = !q || rm.number.toLowerCase().includes(q) || rm.beds.some(bd => bd.tenant && bd.tenant.toLowerCase().includes(q));
        const keep = matchesFilter && matchesSearch;
        if (keep) matchedRooms++;
        return keep;
      }).map(rm => ({
        number: rm.number, sharing: rm.sharing, rentLabel: '\u20b9' + rm.rent.toLocaleString('en-IN'),
        beds: rm.beds.map(bd => ({ label: bd.label, tenant: bd.tenant, occupied: !!bd.tenant, vacant: !bd.tenant, dotColor: bd.tenant ? 'var(--color-success)' : 'var(--color-warning)' })),
      }));
      return { name: fl.name, rooms };
    }).filter(fl => fl.rooms.length > 0);
    return {
      theme: s.theme, themeIcon: s.theme === 'light' ? '\u{1F319}' : '\u2600\uFE0F', toggleTheme: this.toggleTheme,
      ownerMobileTabs: [
        { label: 'Overview', href: 'Owner Dashboard.dc.html' },
        { label: 'Properties', href: 'Properties.dc.html', active: true },
        { label: 'Tenants', href: 'Tenants.dc.html' },
        { label: 'More', href: 'Settings.dc.html?role=owner' },
      ].map(t => ({ ...t, cls: 'bn-item-v2' + (t.active ? ' active' : ''), icon: NAV_ICON[t.label] })),
      properties: Object.keys(s.data).map(id => ({ id, name: s.data[id].name })),
      currentId: s.currentId, selectProperty: this.selectProperty, selectPropertyEvt: this.selectPropertyEvt,
      propertyName: prop.name, floors, isEmpty: matchedRooms === 0,
      search: s.search, setSearch: this.setSearch, filter: s.filter, setFilter: this.setFilter,
      resultSummary: matchedRooms + ' of ' + totalRooms + ' rooms',
      dialogOpen: s.dialogOpen, form: s.form, floorNames: prop.floors.map(fl => fl.name),
      setNumber: this.setNumber, setFloor: this.setFloor, setSharing: this.setSharing, setRent: this.setRent,
      openAdd: this.openAdd, close: this.close, save: this.save,
    };
  }
}
</script>
</body>
</html>
