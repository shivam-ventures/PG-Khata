<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-da389023-42f5-471e-ad5c-349391820232/styles.css">
  <link rel="stylesheet" href="tokens-extra.css">
  <script src="_ds/modernist-da389023-42f5-471e-ad5c-349391820232/_ds_bundle.js"></script>
  <style>
    body{margin:0}
    a{color:var(--color-accent)}
    a:hover{color:var(--color-accent-600)}
    .more-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);text-decoration:none;color:var(--color-text);margin-bottom:8px}
    .more-icon{width:36px;height:36px;border-radius:var(--radius-sm);display:grid;place-items:center;flex:none}
    .pg-switch-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--color-surface-alt);border-bottom:1px solid var(--color-divider)}
  </style>
</helmet>
<div data-theme="{{ theme }}" style="min-height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);display:flex;flex-direction:column;max-width:480px;margin:0 auto;box-shadow:var(--shadow-lg)">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--color-surface);border-bottom:1px solid var(--color-divider)">
    <div style="display:flex;align-items:center;gap:10px">
      <a href="{{ hrefs.today }}" style="color:var(--color-text);text-decoration:none;font-size:18px">←</a>
      <h2 style="margin:0;font-size:19px">More</h2>
    </div>
    <dc-import name="RoleSwitcher" current-role="manager" hint-size="110px,36px"></dc-import>
  </div>

  <div class="pg-switch-bar">
    <dc-import name="PortfolioSwitcher" properties="{{ pgSwitcherOptions }}" current-id="{{ currentPg }}" on-select="{{ onPgSelect }}" hint-size="200px,38px"></dc-import>
  </div>

  <div style="flex:1;overflow:auto;padding:16px">
    <a class="more-row" href="{{ hrefs.tenants }}">
      <div class="more-icon" style="background:var(--color-accent-100);color:var(--color-accent-700)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg></div>
      <div style="flex:1;font-weight:600;font-size:14px">Tenants</div>
      <span class="text-muted">›</span>
    </a>
    <a class="more-row" href="{{ hrefs.complaints }}">
      <div class="more-icon" style="background:var(--color-warning-100);color:var(--color-warning-700)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4.5 8-11V5l-8-3-8 3v6c0 6.5 8 11 8 11Z"/></svg></div>
      <div style="flex:1;font-weight:600;font-size:14px">Complaints</div>
      <span class="text-muted">›</span>
    </a>
    <a class="more-row" href="Settings.dc.html?role=manager">
      <div class="more-icon" style="background:var(--color-neutral-100);color:var(--color-text-secondary)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
      <div style="flex:1;font-weight:600;font-size:14px">Settings</div>
      <span class="text-muted">›</span>
    </a>
    <button class="more-row" style="width:100%;border:1px solid var(--color-divider);cursor:pointer">
      <div class="more-icon" style="background:var(--color-danger-100);color:var(--color-danger-700)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></div>
      <div style="flex:1;font-weight:600;font-size:14px;text-align:left;color:var(--color-danger)">Log out</div>
    </button>
  </div>

  <div class="bottom-nav-v2" style="display:flex;position:sticky;bottom:0">
    <sc-for list="{{ tabs }}" as="tb" hint-placeholder-count="4">
      <a class="{{ tb.cls }}" href="{{ tb.href }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ tb.icon }}"></path></svg><span>{{ tb.label }}</span></a>
    </sc-for>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const PG_NAMES = { hsr: 'HSR PG', ind: 'Indiranagar PG' };

const NAV_ICON = {
  Today: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-4v-7H8v7H4a1 1 0 0 1-1-1V10.5Z',
  Payments: 'M3 7a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7ZM16 12h.01',
  Rooms: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
  More: 'M5 12h.01M12 12h.01M19 12h.01',
};
class Component extends DCLogic {
  state = { theme: 'light' };
  renderVals() {
    const currentPg = ['hsr', 'ind'].includes(new URLSearchParams(window.location.search).get('pg')) ? new URLSearchParams(window.location.search).get('pg') : 'hsr';
    const q = '?pg=' + currentPg;
    return {
      theme: this.state.theme,
      currentPg, onPgSelect: (id) => { window.location.href = 'Manager More.dc.html?pg=' + id; },
      pgSwitcherOptions: Object.keys(PG_NAMES).map(id => ({ id, name: PG_NAMES[id] })),
      hrefs: { today: 'Manager Today.dc.html' + q, tenants: 'Manager Tenants.dc.html' + q, complaints: 'Manager Complaints.dc.html' + q },
      tabs: [
        { label: 'Today', href: 'Manager Today.dc.html' + q }, { label: 'Payments', href: 'Manager Payments.dc.html' + q },
        { label: 'Rooms', href: 'Manager Rooms.dc.html' + q }, { label: 'More', href: 'Manager More.dc.html' + q },
      ].map(t => ({ ...t, cls: 'bn-item-v2' + (t.label === 'More' ? ' active' : ''), icon: NAV_ICON[t.label] })),
    };
  }
}
</script>
</body>
</html>
