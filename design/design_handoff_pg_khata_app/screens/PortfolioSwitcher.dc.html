<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-da389023-42f5-471e-ad5c-349391820232/styles.css">
  <link rel="stylesheet" href="tokens-extra.css">
  <script src="_ds/modernist-da389023-42f5-471e-ad5c-349391820232/_ds_bundle.js"></script>
  <style>
    .pf-switch{position:relative;font-family:var(--font-body);display:inline-block}
    .pf-trigger{display:flex;align-items:center;gap:10px;padding:9px 14px;border:1px solid var(--color-divider);border-radius:var(--radius-sm);background:var(--color-surface);cursor:pointer;font-size:13px;color:var(--color-text);white-space:nowrap;box-shadow:var(--shadow-sm)}
    .pf-trigger:hover{background:var(--color-surface-alt)}
    .pf-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:240px;background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);z-index:30;overflow:hidden}
    .pf-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;font-size:13px;cursor:pointer}
    .pf-item:hover{background:var(--color-surface-alt)}
    .pf-item.active{color:var(--color-accent-700);background:var(--color-accent-100);font-weight:600}
  </style>
</helmet>
<div class="pf-switch">
  <div class="pf-trigger" onClick="{{ toggle }}">
    <span style="font-weight:700">{{ currentName }}</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"></path></svg>
  </div>
  <sc-if value="{{ isOpen }}" hint-placeholder-val="{{ false }}">
    <div class="pf-menu">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="3">
        <div class="{{ it.cls }}" onClick="{{ it.onClick }}">
          <span>{{ it.name }}</span>
          <span class="text-muted" style="font-size:11px">{{ it.meta }}</span>
        </div>
      </sc-for>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:44},&quot;properties&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[],&quot;tsType&quot;:&quot;{id:string,name:string,meta?:string}[]&quot;},&quot;currentId&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string)=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { open: false };
  toggle = () => this.setState(s => ({ open: !s.open }));
  renderVals() {
    const list = this.props.properties || [];
    const current = list.find(p => p.id === this.props.currentId) || list[0] || { id: null, name: 'All properties' };
    const onSelect = this.props.onSelect || (() => {});
    return {
      isOpen: this.state.open,
      currentName: current.name,
      items: list.map(p => ({
        name: p.name, meta: p.meta || '',
        cls: 'pf-item' + (p.id === current.id ? ' active' : ''),
        onClick: () => { onSelect(p.id); this.setState({ open: false }); },
      })),
    };
  }
}

</script>
</body>
</html>
